name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - run: pacman -Syu --noconfirm --needed git rustup github-cli

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the version
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          crate="$(sed -n 's/^version = "\(.*\)"/\1/p' crates/glide-compositor/Cargo.toml | head -n1)"
          if [ "${TAG#v}" != "$crate" ]; then
            echo "::error::tag $TAG does not match version $crate in crates/glide-compositor/Cargo.toml"
            exit 1
          fi
          echo "VERSION=$crate" >> "$GITHUB_ENV"

      - name: Build the Arch package
        run: |
          . data/arch/glide/PKGBUILD
          pacman -S --noconfirm --needed "${depends[@]}" git pkgconf
          useradd -m builder
          install -d -o builder /home/builder/pkg
          install -m644 -o builder data/arch/glide/PKGBUILD /home/builder/pkg/PKGBUILD
          sed -i "s/^pkgver=.*/pkgver=$VERSION/" /home/builder/pkg/PKGBUILD
          git archive --format=tar.gz --prefix="glide-$VERSION/" -o "/home/builder/pkg/glide-$VERSION.tar.gz" HEAD
          install -m644 -o builder rust-toolchain.toml /home/builder/rust-toolchain.toml
          chown builder /home/builder/pkg/*
          runuser -u builder -- sh -c 'cd ~ && rustup toolchain install --profile minimal && cd ~/pkg && makepkg -f --noconfirm'

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd /home/builder/pkg
          package="$(ls *.pkg.tar.zst)"
          sha256sum "$package" > "$package.sha256"
          {
            if [ "$(git -C "$GITHUB_WORKSPACE" cat-file -t "$TAG")" = tag ]; then
              git -C "$GITHUB_WORKSPACE" tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$TAG"
            fi
            prev="$(git -C "$GITHUB_WORKSPACE" describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)"
            if [ -n "$prev" ]; then
              echo "## Changes since $prev"
              echo
              git -C "$GITHUB_WORKSPACE" log --no-merges --reverse --format='- %s (%h)' "$prev..$TAG"
              echo
              echo "**Full changelog:** $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$prev...$TAG"
            else
              echo "## First release"
            fi
            echo
            echo "## Install on Arch Linux"
            echo
            echo '```sh'
            echo "sudo pacman -U $package"
            echo '```'
          } > notes.md
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag --title "Glide $VERSION" \
            --notes-file notes.md "$package" "$package.sha256"
