name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - run: |
          pacman -Syu --noconfirm --needed git rustup pkgconf seatd systemd-libs libinput mesa libxkbcommon \
            libdisplay-info dbus tzdata pam gstreamer gst-plugins-base gst-plugins-good gst-plugins-bad gst-plugins-ugly
          ln -sf /usr/share/zoneinfo/UTC /etc/localtime
      - uses: actions/checkout@v4
      - run: rustup toolchain install --profile minimal
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-
      - run: cargo test --workspace --locked
