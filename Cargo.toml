[workspace]
resolver = "3"
members = [
    "crates/glide-app",
    "crates/glide-appmenu",
    "crates/glide-cast",
    "crates/glide-clips",
    "crates/glide-catalog",
    "crates/glide-compositor",
    "crates/glide-config",
    "crates/glide-dock",
    "crates/glide-geom",
    "crates/glide-gestures",
    "crates/glide-greeter",
    "crates/glide-iced",
    "crates/glide-files",
    "crates/glide-folio",
    "crates/glide-launcher",
    "crates/glide-layout",
    "crates/glide-ipc",
    "crates/glide-keychain",
    "crates/glide-login-key",
    "crates/glide-media",
    "crates/glide-netbird",
    "crates/glide-notify",
    "crates/glide-overlays",
    "crates/glide-paint",
    "crates/glide-pam",
    "crates/glide-passwords",
    "crates/glide-phone",
    "crates/glide-photos",
    "crates/glide-portal",
    "crates/glide-sdk",
    "crates/glide-services",
    "crates/glide-settings",
    "crates/glide-shell",
    "crates/glide-shot",
    "crates/glide-system",
    "crates/glide-terminal",
    "crates/glide-text",
    "crates/glide-theme",
    "crates/glide-topbar",
    "crates/glide-tray",
    "crates/glide-ui",
    "crates/glide-video",
    "crates/glide-welcome",
    "crates/glide-xembed",
    "crates/glidectl",
]

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "GPL-3.0-or-later"
repository = "https://github.com/Glide-Desktop/glide"

[profile.release]
debug = "line-tables-only"
lto = "thin"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.dev.package.pbkdf2]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.dev.package.rsa]
opt-level = 3

[profile.dev.package.rust-argon2]
opt-level = 3

[profile.dev.package.aes]
opt-level = 3

[workspace.dependencies]
smithay = { git = "https://github.com/Smithay/smithay", rev = "24647fc8d00131eb7f388efed26e35ea316b0018", default-features = false }
smithay-drm-extras = { git = "https://github.com/Smithay/smithay", rev = "24647fc8d00131eb7f388efed26e35ea316b0018" }
tracing = "0.1.37"
tracing-subscriber = { version = "0.3.16", features = ["env-filter"] }
bitflags = "2.2.1"
xcursor = "0.3.11"
thiserror = "2.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1"
zbus = "5"

[workspace.lints.rust]
future-incompatible = "warn"
nonstandard_style = { level = "deny", priority = -1 }
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = 10 }
redundant_clone = { level = "deny", priority = 9 }
manual_while_let_some = { level = "deny", priority = 4 }
pedantic = { level = "warn", priority = 3 }
missing_errors_doc = { level = "allow", priority = 4 }
missing_panics_doc = { level = "allow", priority = 4 }
cast_possible_truncation = { level = "allow", priority = 4 }
cast_precision_loss = { level = "allow", priority = 4 }
cast_sign_loss = { level = "allow", priority = 4 }
cast_possible_wrap = { level = "allow", priority = 4 }
cast_lossless = { level = "allow", priority = 4 }
float_cmp = { level = "allow", priority = 4 }
