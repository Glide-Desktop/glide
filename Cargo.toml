[workspace]
resolver = "3"
members = [
    "crates/glide-compositor",
    "crates/glide-config",
    "crates/glide-geom",
    "crates/glide-layout",
    "crates/glide-ipc",
    "crates/glide-paint",
    "crates/glide-theme",
    "crates/glide-ui",
    "crates/glidectl",
]

[workspace.package]
edition = "2024"
rust-version = "1.87"
license = "GPL-3.0-or-later"
repository = "https://github.com/artem/glide"

[workspace.dependencies]
smithay = { git = "https://github.com/Smithay/smithay", rev = "5fb12b87407b3680135c45d94214c5f1b1d0fbea", default-features = false }
smithay-drm-extras = { git = "https://github.com/Smithay/smithay", rev = "5fb12b87407b3680135c45d94214c5f1b1d0fbea" }
tracing = "0.1.37"
tracing-subscriber = { version = "0.3.16", features = ["env-filter"] }
bitflags = "2.2.1"
xcursor = "0.3.11"
thiserror = "2.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

[workspace.lints.rust]
future-incompatible = "warn"
nonstandard_style = { level = "deny", priority = -1 }
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = 10 }
redundant_clone = { level = "deny", priority = 9 }
manual_while_let_some = { level = "deny", priority = 4 }
pedantic = { level = "warn", priority = 3 }
missing_errors_doc = { level = "allow", priority = 4 }
missing_panics_doc = { level = "allow", priority = 4 }
