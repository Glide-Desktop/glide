[package]
name = "glide-compositor"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "glide"
path = "src/main.rs"

[features]
profile-with-tracy = ["profiling/profile-with-tracy", "dep:tracy-client"]

[dependencies]
tracing.workspace = true
tracing-subscriber.workspace = true
bitflags.workspace = true
smithay-drm-extras.workspace = true
xcursor.workspace = true
thiserror.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
libc = "0.2"
png = "0.18"
glide-config = { path = "../glide-config" }
glide-geom = { path = "../glide-geom" }
glide-ipc = { path = "../glide-ipc" }
glide-layout = { path = "../glide-layout" }
glide-paint = { path = "../glide-paint" }
glide-theme = { path = "../glide-theme" }
glide-ui = { path = "../glide-ui" }
profiling = "1.0.18"
tracy-client = { version = "0.18.4", optional = true }

[dependencies.smithay]
workspace = true
features = [
    "backend_libinput",
    "backend_session_libseat",
    "backend_udev",
    "backend_drm",
    "backend_gbm",
    "renderer_gl",
    "wayland_frontend",
    "desktop",
]
