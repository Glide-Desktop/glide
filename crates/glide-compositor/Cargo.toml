[package]
name = "glide-compositor"
version = "0.1.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "glide"
path = "src/main.rs"

[features]
profile-with-tracy = ["profiling/profile-with-tracy", "dep:tracy-client"]

[dependencies]
tracing.workspace = true
tracing-subscriber.workspace = true
bitflags.workspace = true
smithay-drm-extras.workspace = true
xcursor.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
toml_edit = "0.25"
libc = "0.2"
rqrr = "0.10"
glide-appmenu = { path = "../glide-appmenu" }
glide-cast = { path = "../glide-cast" }
glide-config = { path = "../glide-config" }
glide-dock = { path = "../glide-dock" }
glide-geom = { path = "../glide-geom" }
glide-gestures = { path = "../glide-gestures" }
glide-greeter = { path = "../glide-greeter" }
glide-ipc = { path = "../glide-ipc" }
glide-launcher = { path = "../glide-launcher" }
glide-layout = { path = "../glide-layout" }
glide-media = { path = "../glide-media" }
glide-netbird = { path = "../glide-netbird" }
glide-notify = { path = "../glide-notify" }
glide-overlays = { path = "../glide-overlays" }
glide-paint = { path = "../glide-paint" }
glide-services = { path = "../glide-services" }
glide-shell = { path = "../glide-shell" }
glide-shot = { path = "../glide-shot" }
glide-system = { path = "../glide-system" }
glide-theme = { path = "../glide-theme" }
glide-topbar = { path = "../glide-topbar" }
glide-tray = { path = "../glide-tray" }
glide-ui = { path = "../glide-ui" }
profiling = "1.0.18"
wayland-backend = "0.3"
wayland-scanner = "0.31"
wayland-server = "0.31"
tracy-client = { version = "0.18.4", optional = true }
zbus.workspace = true
zeroize = "1"
glide-app = { path = "../glide-app" }

[dependencies.smithay]
workspace = true
features = [
    "backend_libinput",
    "backend_session_libseat",
    "backend_udev",
    "backend_drm",
    "backend_gbm",
    "renderer_gl",
    "wayland_frontend",
    "desktop",
]

[dev-dependencies]
glide-services = { path = "../glide-services", features = ["test-bus"] }
qrcode = { version = "0.14", default-features = false }
