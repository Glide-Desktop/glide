[package]
name = "glide-text"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "glide_text"
path = "src/lib.rs"

[[bin]]
name = "glide-text"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
iced = { version = "0.14.0", default-features = false, features = [
    "wgpu",
    "tiny-skia",
    "crisp",
    "wayland",
    "tokio",
    "svg",
    "image",
    "web-colors",
    "advanced",
    "markdown",
] }
glide-app = { path = "../glide-app" }
glide-config = { path = "../glide-config" }
glide-iced = { path = "../glide-iced" }
glide-paint = { path = "../glide-paint" }
glide-theme = { path = "../glide-theme" }
glide-ui = { path = "../glide-ui" }
regex = "1"
serde.workspace = true
toml.workspace = true
toml_edit = "0.25"
zbus = "5"
tree-sitter = "0.25"
tree-sitter-highlight = "0.25"
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-css = "0.25"
tree-sitter-go = "0.25"
tree-sitter-html = "0.23"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24"
tree-sitter-lua = "0.5"
tree-sitter-md = "0.5"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-toml-ng = "0.7"
tree-sitter-typescript = "0.23"
tree-sitter-xml = "0.7"
tree-sitter-yaml = "0.7"

[dev-dependencies]
iced_tiny_skia = { version = "0.14", default-features = false }
