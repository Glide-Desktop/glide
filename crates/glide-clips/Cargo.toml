[package]
name = "glide-clips"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Borderless video player with trimming, clips and export for Glide"

[lib]
name = "glide_clips"
path = "src/lib.rs"

[[bin]]
name = "glide-clips"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
iced = { version = "0.14.0", default-features = false, features = [
    "wgpu",
    "tiny-skia",
    "crisp",
    "wayland",
    "tokio",
    "svg",
    "image",
    "web-colors",
    "advanced",
] }
glide-config = { path = "../glide-config" }
glide-sdk = { path = "../glide-sdk" }
glide-video = { path = "../glide-video" }
image = { version = "0.25", default-features = false, features = ["png"] }
serde.workspace = true
toml.workspace = true
tracing.workspace = true
zbus.workspace = true
