[package]
name = "glide-settings"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "glide_settings"
path = "src/lib.rs"

[[bin]]
name = "glide-settings"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
iced = { version = "0.14.0", default-features = false, features = [
    "wgpu",
    "tiny-skia",
    "crisp",
    "wayland",
    "tokio",
    "svg",
    "image",
    "web-colors",
    "advanced",
] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
glide-config = { path = "../glide-config" }
glide-sdk = { path = "../glide-sdk" }
glide-ipc = { path = "../glide-ipc" }
glide-netbird = { path = "../glide-netbird" }
glide-terminal = { path = "../glide-terminal" }
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
toml_edit = "0.25"
zbus.workspace = true

[dev-dependencies]
glide-theme = { path = "../glide-theme" }
