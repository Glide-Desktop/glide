[package]
name = "glide-keychain"
version = "0.1.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
aes = "0.8"
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc"] }
hkdf = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
rsa = { version = "0.9", default-features = false, features = ["std"] }
ureq = { version = "3", features = ["json"] }
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
blocking = "1"
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
data-encoding = "2"
getrandom = "0.4"
glide-config = { path = "../glide-config" }
glide-ipc = { path = "../glide-ipc" }
glide-login-key = { path = "../glide-login-key" }
libc = "0.2"
hmac = "0.12"
keepass = { version = "0.17", features = ["save_kdbx4"] }
serde.workspace = true
serde_json.workspace = true
sha1 = "0.10"
sha2 = "0.10"
zbus.workspace = true
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json.workspace = true
zbus.workspace = true

[lints]
workspace = true
