[package]
name = "glide-face"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "glide_face"
path = "src/lib.rs"

[[bin]]
name = "facekey"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
ort = { version = "=2.0.0-rc.9", default-features = false, features = ["load-dynamic", "ndarray"] }
ort-sys = { version = "=2.0.0-rc.9", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
tiny-skia = "0.11"
serde.workspace = true
serde_json.workspace = true
chrono = { version = "0.4", features = ["serde"] }
aes-gcm = "0.10"
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
hex = "0.4"
libc = "0.2"
nix = { version = "0.29", features = ["user", "fs", "hostname"] }
crossbeam-channel = "0.5"
thiserror.workspace = true
base64 = "0.22"
toml.workspace = true
glide-config = { path = "../glide-config" }

[dev-dependencies]
tempfile = "3"

[[test]]
name = "integration"
path = "tests/integration/main.rs"
