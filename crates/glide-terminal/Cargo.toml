[package]
name = "glide-terminal"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "glide_terminal"
path = "src/lib.rs"

[[bin]]
name = "glide-terminal"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
iced = { version = "0.14.0", default-features = false, features = [
    "wgpu",
    "tiny-skia",
    "crisp",
    "wayland",
    "tokio",
    "svg",
    "image",
    "web-colors",
    "advanced",
] }
alacritty_terminal = { version = "0.26", default-features = false }
glide-config = { path = "../glide-config" }
glide-sdk = { path = "../glide-sdk" }
rustix = { version = "1", default-features = false, features = ["std", "termios", "pipe"] }
serde.workspace = true
toml.workspace = true
toml_edit = "0.25"
glide-app = { path = "../glide-app" }
shlex = "1"
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"] }
wayland-client = "0.31"
zbus = "5"

[dev-dependencies]
iced_tiny_skia = { version = "0.14", default-features = false }
